<svg width="720" height="192" viewBox="0 0 720 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Remark logo</title>
  <desc>A rounded speech bubble containing a stylized remark mark, followed by the word Remark.</desc>

  <defs>
    <linearGradient id="remark-gradient" x1="24" y1="20" x2="164" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(16 16)">
    <path
      d="M82 0C36.712 0 0 34.026 0 76C0 96.03 8.57 114.22 22.7 127.45L14 160L51.95 143.28C61.2 146.33 71.31 148 82 148C127.288 148 164 113.974 164 72C164 32.235 127.288 0 82 0Z"
      fill="url(#remark-gradient)"
    />

