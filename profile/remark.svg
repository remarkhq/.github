    <path
      d="M83.5 28L93.28 58.72L124 68.5L93.28 78.28L83.5 109L73.72 78.28L43 68.5L73.72 58.72L83.5 28Z"
      fill="white"
    />
    <circle cx="121" cy="35" r="7" fill="#C4B5FD"/>
    <circle cx="39" cy="106" r="5" fill="#A78BFA"/>
  </g>

  <!-- Wordmark -->
  <text
    x="210"
    y="123"
    fill="#17172A"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="86"
    font-weight="750"
    letter-spacing="-3.5"
  >remark</text>
